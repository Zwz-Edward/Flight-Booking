# 生产环境配置 - 使用 MySQL
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/flight_booking?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: your_password

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false

  sql:
    init:
      mode: never

