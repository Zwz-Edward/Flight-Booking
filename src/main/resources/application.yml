server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: flight-booking

  profiles:
    active: dev

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

  # 静态资源
  web:
    resources:
      static-locations: classpath:/static/

  # Thymeleaf
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

# JWT 配置
jwt:
  secret: YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY3ODkwYWJjZGVmZ2hpamtsbW5vcA==
  expiration: 86400000  # 24小时

# 日志配置
logging:
  level:
    com.flightbooking: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
