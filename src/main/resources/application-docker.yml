# Docker 环境配置 - 覆盖 datasource 和 redis 的主机名
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/flight_booking?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root

  data:
    redis:
      host: redis
      port: 6379
